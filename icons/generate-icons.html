<!DOCTYPE html>
<html>
<head>
  <title>生成插件图标</title>
</head>
<body>
  <h1>插件图标生成器</h1>
  <p>右键点击下方图标，选择"另存为图片"，保存为对应的 PNG 文件</p>
  
  <h3>icon16.png (16x16)</h3>
  <canvas id="icon16" width="16" height="16"></canvas>
  
  <h3>icon48.png (48x48)</h3>
  <canvas id="icon48" width="48" height="48"></canvas>
  
  <h3>icon128.png (128x128)</h3>
  <canvas id="icon128" width="128" height="128"></canvas>
  
  <script>
    function drawIcon(canvasId, size) {
      const canvas = document.getElementById(canvasId);
      const ctx = canvas.getContext('2d');
      
      // 背景
      ctx.fillStyle = '#10a37f';
      ctx.beginPath();
      ctx.roundRect(0, 0, size, size, size * 0.18);
      ctx.fill();
      
      // 聊天气泡
      ctx.fillStyle = 'white';
      const bubbleSize = size * 0.5;
      const bubbleX = size * 0.25;
      const bubbleY = size * 0.2;
      
      ctx.beginPath();
      ctx.roundRect(bubbleX, bubbleY, bubbleSize, bubbleSize * 0.7, size * 0.08);
      ctx.fill();
      
      // 聊天气泡尾巴
      ctx.beginPath();
      ctx.moveTo(bubbleX + bubbleSize * 0.2, bubbleY + bubbleSize * 0.7);
      ctx.lineTo(bubbleX + bubbleSize * 0.1, bubbleY + bubbleSize * 0.9);
      ctx.lineTo(bubbleX + bubbleSize * 0.4, bubbleY + bubbleSize * 0.7);
      ctx.fill();
      
      // 三个点
      ctx.fillStyle = '#10a37f';
      const dotSize = size * 0.06;
      const dotY = bubbleY + bubbleSize * 0.35;
      const dotSpacing = size * 0.12;
      const dotStartX = bubbleX + bubbleSize * 0.25;
      
      for (let i = 0; i < 3; i++) {
        ctx.beginPath();
        ctx.arc(dotStartX + i * dotSpacing, dotY, dotSize, 0, Math.PI * 2);
        ctx.fill();
      }
    }
    
    drawIcon('icon16', 16);
    drawIcon('icon48', 48);
    drawIcon('icon128', 128);
    
    // 自动下载
    function downloadCanvas(canvasId, filename) {
      const canvas = document.getElementById(canvasId);
      const link = document.createElement('a');
      link.download = filename;
      link.href = canvas.toDataURL('image/png');
      link.click();
    }
  </script>
  
  <br><br>
  <button onclick="downloadCanvas('icon16', 'icon16.png')">下载 icon16.png</button>
  <button onclick="downloadCanvas('icon48', 'icon48.png')">下载 icon48.png</button>
  <button onclick="downloadCanvas('icon128', 'icon128.png')">下载 icon128.png</button>
</body>
</html>
