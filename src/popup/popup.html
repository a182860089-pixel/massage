<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ChatGPT 对话保存助手</title>
  <link rel="stylesheet" href="popup.css">
</head>
<body>
  <div class="container">
    <!-- 头部 Logo 和标题 -->
    <header>
      <div class="logo-wrapper">
        <img src="/icons/logo.png" alt="Logo" class="logo">
      </div>
      <h1>ChatGPT 对话保存助手</h1>
      <p class="subtitle">自动保存您的智慧对话</p>
    </header>

    <!-- 未授权状态 -->
    <div id="setup-section" class="section">
      <div class="welcome-card">
        <div class="welcome-icon">👋</div>
        <h2>欢迎使用</h2>
        <p>首次使用需要选择一个文件夹来保存对话记录。</p>
      </div>
      <button id="authorize-btn" class="btn btn-primary btn-large">
        <span class="btn-icon">📂</span>
        选择保存文件夹
      </button>
      <div class="features">
        <div class="feature-item">
          <span class="feature-icon">✨</span>
          <span>自动实时保存</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">💾</span>
          <span>支持 HTML/MD/PDF</span>
        </div>
        <div class="feature-item">
          <span class="feature-icon">📁</span>
          <span>按工作空间分类</span>
        </div>
      </div>
    </div>

    <!-- 已授权状态 -->
    <div id="main-section" class="section hidden">
      <div class="status-card">
        <div class="status-header">
          <div class="status-indicator active"></div>
          <span id="status-text">正在监听对话</span>
        </div>
        <div class="status-details">
          <div class="detail-row">
            <span class="detail-icon">📂</span>
            <span class="detail-label">保存位置</span>
            <span id="save-path" class="detail-value">未设置</span>
          </div>
          <div class="detail-row">
            <span class="detail-icon">📊</span>
            <span class="detail-label">已保存</span>
            <span class="detail-value"><span id="saved-count">0</span> 个对话</span>
          </div>
        </div>
      </div>

      <div class="settings-card">
        <h3>📤 导出格式</h3>
        <div class="format-options">
          <label class="format-option">
            <input type="checkbox" id="export-html" checked>
            <span class="format-badge html">HTML</span>
          </label>
          <label class="format-option">
            <input type="checkbox" id="export-md" checked>
            <span class="format-badge md">MD</span>
          </label>
          <label class="format-option">
            <input type="checkbox" id="export-pdf" checked>
            <span class="format-badge pdf">PDF</span>
          </label>
          <label class="format-option">
            <input type="checkbox" id="export-json" checked>
            <span class="format-badge json">JSON</span>
          </label>
        </div>
      </div>

      <div class="settings-card" id="token-budget-card">
        <h3>📊 Token 预算</h3>
        <div class="token-info">
          <div class="detail-row">
            <span class="detail-icon">🏢</span>
            <span class="detail-label">工作空间</span>
            <span id="token-workspace" class="detail-value">-</span>
          </div>
          <div class="detail-row">
            <span class="detail-icon">🔢</span>
            <span class="detail-label">已用 Token</span>
            <span id="token-consumed" class="detail-value">0</span>
          </div>
          <div class="token-progress-container">
            <div id="token-progress" class="token-progress" style="width: 0%"></div>
          </div>
        </div>
      </div>

      <div class="actions">
        <button id="export-now-btn" class="btn btn-primary">
          <span class="btn-icon">💾</span>
          立即导出当前对话
        </button>
        <button id="change-folder-btn" class="btn btn-secondary">
          <span class="btn-icon">📁</span>
          更换保存文件夹
        </button>
      </div>
    </div>

    <!-- 底部 -->
    <footer>
      <span>Made with ❤️ for ChatGPT users</span>
    </footer>

    <!-- 提示信息 -->
    <div id="toast" class="toast hidden"></div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
